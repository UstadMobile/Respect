appId: world.respect.app
onFlowStart:
  - clearState: world.respect.app
  - runScript:
      file: "scripts/school_init.js"
      env:
        TESTCONTROLLER_URL: ${TESTCONTROLLER_URL}
        SCHOOL_ADMIN_PASSWORD: ${SCHOOL_ADMIN_PASSWORD}
        DIR_ADMIN_AUTH_HEADER: ${DIR_ADMIN_AUTH_HEADER}
        SCHOOL_URL: ${SCHOOL_URL}
        SCHOOL_NAME: ${SCHOOL_NAME}
        URL_SUBSTITUTION: ${URL_SUBSTITUTION}
        NAME: "006_user_send_feedback_test"

onFlowComplete:
  - runFlow:
      file: "subflows/teardown.yaml"
      env:
        NAME: "db-final"
---
- runFlow: "subflows/school_admin_login_flow.yaml"
- runFlow:
     file: "subflows/add_person_create_account.yaml"
     env:
       FIRSTNAME: TEST
       LASTNAME: USER
       GENDER: Male
       ROLE: Student
       USERNAME: testuser
       PASSWORD: test123
- runFlow:
    file: "subflows/e2e_artifact_upload.yaml"
    env:
      NAME: "db-student-share-feedback"
- clearState: world.respect.app
- runFlow:
    file: "subflows/school_user_login_flow.yaml"
    env:
      USERNAME: testuser
      PASSWORD: test123
- assertVisible: "Apps"
- tapOn:
    id: "user_account_icon"
- tapOn: "Send feedback"
- assertVisible:
    id: "app_title"
    text: "Send feedback"
- assertVisible: "Message the developers on WhatsApp"
- assertVisible: "Email the developers"
- assertVisible: "Public forum"
- tapOn: "Public forum"
- runFlow:
    file: "subflows/chrome-first-run-check.yaml"
- assertVisible: "Welcome to discussions!"